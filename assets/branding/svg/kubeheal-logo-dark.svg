<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 160" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329" />
      <stop offset="50%" stop-color="#070b18" />
      <stop offset="100%" stop-color="#03050c" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="30%" stop-color="#00BAF2" />
      <stop offset="70%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="healGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="60%" stop-color="#00BAF2" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="40%" stop-color="#00E5FF" />
      <stop offset="70%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="crossGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E5FF" />
      <stop offset="45%" stop-color="#0284C7" />
      <stop offset="80%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#4F46E5" />
    </linearGradient>

    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C" />
      <stop offset="100%" stop-color="#EE0000" />
    </linearGradient>

    <radialGradient id="glowEffect" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#3B82F6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#070b18" stop-opacity="0" />
    </radialGradient>

    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="3" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
</defs>
  <rect width="740" height="160" rx="16" fill="#070C1B" fill-opacity="0.95" />
  <rect width="740" height="160" rx="16" fill="none" stroke="#1E293B" stroke-width="1.5" />

  <!-- Embedded Icon Mark (Left) -->
  <g transform="translate(14, 10) scale(0.28)">
    
  <circle cx="250" cy="250" r="220" fill="url(#glowEffect)" />

  <polygon points="250,28 442,138.8 442,361.2 250,472 58,361.2 58,138.8"
           fill="url(#bgGrad)"
           stroke="url(#borderGrad)"
           stroke-width="12"
           stroke-linejoin="round"
           filter="url(#softGlow)" />

  <polygon points="250,48 422,147.5 422,352.5 250,452 78,352.5 78,147.5"
           fill="none"
           stroke="#3B82F6"
           stroke-width="2"
           stroke-dasharray="8 6"
           stroke-opacity="0.35"
           stroke-linejoin="round" />

  <!-- Neural Mesh -->
  <g id="neuralMesh" stroke="#60A5FA" stroke-opacity="0.45" stroke-width="2" filter="url(#softGlow)">
    <line x1="280" y1="210" x2="330" y2="170" />
    <line x1="280" y1="290" x2="335" y2="325" />
    <line x1="330" y1="170" x2="385" y2="155" />
    <line x1="330" y1="170" x2="350" y2="230" />
    <line x1="350" y1="230" x2="335" y2="325" />
    <line x1="350" y1="230" x2="405" y2="245" />
    <line x1="385" y1="155" x2="405" y2="245" />
    <line x1="335" y1="325" x2="390" y2="340" />
    <line x1="405" y1="245" x2="390" y2="340" />
    <line x1="330" y1="170" x2="295" y2="135" />
    <line x1="385" y1="155" x2="360" y2="105" />
    <line x1="350" y1="230" x2="305" y2="250" stroke="#00F5D4" stroke-opacity="0.6" stroke-width="2.5" />
    <line x1="390" y1="340" x2="355" y2="395" />
    <line x1="335" y1="325" x2="290" y2="370" />
    <line x1="305" y1="250" x2="350" y2="230" stroke="#38BDF8" stroke-width="3" stroke-opacity="0.8" />
  </g>

  <!-- Neural Nodes -->
  <g id="neuralNodes" filter="url(#neonGlow)">
    <circle cx="295" cy="135" r="5" fill="#818CF8" />
    <circle cx="360" cy="105" r="4.5" fill="#A78BFA" />
    <circle cx="330" cy="170" r="7.5" fill="#38BDF8" stroke="#FFFFFF" stroke-width="1.5" />
    <circle cx="385" cy="155" r="6.5" fill="#818CF8" />
    <circle cx="350" cy="230" r="8.5" fill="#00E5FF" stroke="#FFFFFF" stroke-width="2" />
    <circle cx="405" cy="245" r="7" fill="#6366F1" stroke="#E0E7FF" stroke-width="1.5" />
    <circle cx="335" cy="325" r="7" fill="#38BDF8" />
    <circle cx="390" cy="340" r="6" fill="#818CF8" />
    <circle cx="355" cy="395" r="5" fill="#A78BFA" />
    <circle cx="290" cy="370" r="4.5" fill="#6366F1" />
  </g>

  <!-- Healing Cross -->
  <g id="healingCross" filter="url(#neonGlow)">
    <path d="M 216,190 L 254,190 L 254,231 L 295,231 L 295,269 L 254,269 L 254,310 L 216,310 L 216,269 L 175,269 L 175,231 L 216,231 Z"
          fill="url(#crossGrad)"
          stroke="#38BDF8"
          stroke-width="3"
          stroke-linejoin="round" />
  </g>

  <!-- Cross Core Accent -->
  <path d="M 224,202 L 246,202 L 246,239 L 283,239 L 283,261 L 246,261 L 246,298 L 224,298 L 224,261 L 187,261 L 187,239 L 224,239 Z"
        fill="#070b18"
        fill-opacity="0.4"
        stroke="#00F5D4"
        stroke-width="1"
        stroke-opacity="0.6"
        stroke-linejoin="round" />

  <!-- Pulse Wave -->
  <g id="telemetryPulse" filter="url(#neonGlow)">
    <path d="M 58,250 L 115,250 L 128,235 L 138,265 L 148,250 L 160,250 L 174,185 L 188,325 L 200,240 L 212,260 L 225,250 L 245,250 L 255,215 L 268,285 L 278,250 L 305,250 L 322,238 L 350,230"
          fill="none"
          stroke="url(#pulseGrad)"
          stroke-width="5.5"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- OpenShift Red Vital Peak -->
    <path d="M 170,205 L 174,185 L 180,240"
          fill="none"
          stroke="url(#accentGrad)"
          stroke-width="5.5"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <circle cx="115" cy="250" r="3.5" fill="#00F5D4" />
    <circle cx="174" cy="185" r="4.5" fill="#FF4B72" stroke="#FFFFFF" stroke-width="1" />
    <circle cx="188" cy="325" r="4" fill="#00E5FF" />
    <circle cx="255" cy="215" r="4" fill="#38BDF8" />
    <circle cx="268" cy="285" r="4" fill="#00F5D4" />
    <circle cx="305" cy="250" r="5" fill="#00F5D4" stroke="#FFFFFF" stroke-width="1.5" />
  </g>

  </g>

  <!-- Typography -->
  <g font-family="'Red Hat Text', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <!-- Brand Title -->
    <text x="175" y="90" font-size="64" font-weight="800" letter-spacing="-0.5px">
      <tspan fill="#FFFFFF">Kube</tspan><tspan fill="url(#healGrad)">Heal</tspan>
    </text>

    <!-- Category Pill Badge -->
    <rect x="495" y="52" width="138" height="24" rx="12" fill="#0369A1" fill-opacity="0.35" stroke="#0284C7" stroke-width="1.2" />
    <text x="564" y="68" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="1px" text-anchor="middle">AIOPS PLATFORM</text>

    <!-- Subtitle -->
    <text x="178" y="124" font-size="16.5" font-weight="500" fill="#94A3B8" letter-spacing="0.2px">
      Autonomous Self-Healing for OpenShift &amp; Kubernetes
    </text>
  </g>
</svg>