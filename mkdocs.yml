site_name: OpenShift AIOps Self-Healing Platform
site_url: https://kubeheal.github.io/openshift-aiops-platform/
site_description: Production-ready AIOps platform for OpenShift with ML-powered anomaly detection
site_author: KubeHeal Team
repo_url: https://github.com/KubeHeal/openshift-aiops-platform
repo_name: openshift-aiops-platform
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: assets/branding/svg/kubeheal-icon.svg
  favicon: assets/branding/png/favicon.png
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search
  - git-revision-date-localized:
      enable_creation_date: true
  - mermaid2

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      use_pygments: false
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:mermaid2.fence_mermaid_custom
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.inlinehilite
  - toc:
      permalink: true
  - tables
  - footnotes
  - attr_list
  - md_in_html
  - def_list
  - abbr

