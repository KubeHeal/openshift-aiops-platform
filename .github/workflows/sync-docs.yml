name: Sync Root Files to Docs

on:
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'DEPLOYMENT.md'
      - 'CONTRIBUTING.md'
      - 'CODE_OF_CONDUCT.md'
      - 'AGENTS.md'

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Configure Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Sync root files to docs/
        run: |
          echo "🔄 Syncing root files to docs/..."

          # Copy files (only if source exists)
          for f in README.md DEPLOYMENT.md CONTRIBUTING.md CODE_OF_CONDUCT.md AGENTS.md; do
            if [ -f "$f" ]; then
              cp "$f" "docs/$f"
            fi
          done

          echo "✅ Files synced"

      - name: Check for changes
        id: check_changes
        run: |
          if git diff --quiet docs/; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No changes to commit"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📝 Changes detected"
          fi

      - name: Create PR if changed
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          BRANCH="auto/sync-docs-$(date +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"

          git add docs/README.md docs/DEPLOYMENT.md docs/CONTRIBUTING.md docs/CODE_OF_CONDUCT.md docs/AGENTS.md

          CHANGED_FILES=$(git diff --cached --name-only | grep '^docs/' || echo '  (none)')

          git commit -m "docs: auto-sync root files to docs/

          Automatically synced by .github/workflows/sync-docs.yml

          Changed files:
          ${CHANGED_FILES}"

          git push origin "$BRANCH"

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "docs: auto-sync root files to docs/" \
            --body "Automatically synced root documentation files to \`docs/\` directory.

          This PR was created by the **Sync Root Files to Docs** workflow because
          root-level documentation files were updated.

          **Changed files:**
          \`\`\`
          ${CHANGED_FILES}
          \`\`\`

          > Auto-generated by \`.github/workflows/sync-docs.yml\`" \
            --label "documentation"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
