name: Validate Pattern

# Validates the self-healing platform deployment on a live OpenShift cluster.
#
# Architecture: 4-job pipeline modeled on coordination-engine e2e-openshift.yaml
#   check-trigger → check-cluster → validate-pattern → e2e-status
#
# Trigger modes:
#   - push/PR to main or release-*: auto-triggered (PR requires 'e2e-test' label)
#   - workflow_dispatch: manual trigger with cluster credentials
#
# Cluster credentials (two ways):
#   1. Manual trigger: provide ocp_api_url and ocp_token as inputs
#   2. Automatic runs: set OCP_API_URL and OCP_TOKEN repository secrets
#
# If no cluster is configured, the workflow passes gracefully (no red X).

on:
  push:
    branches: [main, 'release-*']
  pull_request:
    branches: [main, 'release-*']
    types: [labeled, opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      ocp_api_url:
        description: 'OpenShift API URL (e.g., https://api.cluster.example.com:6443)'
        required: true
        type: string
      ocp_token:
        description: 'OpenShift login token (from `oc whoami -t`)'
        required: true
        type: string
      skip_install:
        description: 'Skip pattern installation (validate existing deployment only)'
        required: false
        type: boolean
        default: false

env:
  PLATFORM_NS: self-healing-platform
  HUB_NS: self-healing-platform-hub

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  # Job 1: Determine whether E2E should run based on trigger type
  # ──────────────────────────────────────────────────────────────────────────
  check-trigger:
    name: Check E2E Trigger
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
      - name: Evaluate trigger
        id: check
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "E2E triggered by push to ${{ github.ref }}"
          elif [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "E2E triggered manually"
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            if [ "${{ contains(github.event.pull_request.labels.*.name, 'e2e-test') }}" == "true" ]; then
              echo "should_run=true" >> $GITHUB_OUTPUT
              echo "E2E triggered by 'e2e-test' label on PR #${{ github.event.pull_request.number }}"
            else
              echo "should_run=false" >> $GITHUB_OUTPUT
              echo "E2E skipped -- add 'e2e-test' label to PR to enable"
            fi
          else
            echo "should_run=false" >> $GITHUB_OUTPUT
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # Job 2: Verify the OpenShift cluster is reachable
  # ──────────────────────────────────────────────────────────────────────────
  check-cluster:
    name: Check Cluster Availability
    runs-on: ubuntu-latest
    needs: check-trigger
    if: needs.check-trigger.outputs.should_run == 'true'
    outputs:
      cluster_available: ${{ steps.check.outputs.cluster_available }}
    steps:
      - name: Probe cluster API
        id: check
        env:
          OCP_API_URL: ${{ github.event.inputs.ocp_api_url || secrets.OCP_API_URL }}
          OCP_TOKEN: ${{ github.event.inputs.ocp_token || secrets.OCP_TOKEN }}
        run: |
          if [ -z "$OCP_API_URL" ] || [ -z "$OCP_TOKEN" ]; then
            echo "cluster_available=false" >> $GITHUB_OUTPUT
            echo "No OpenShift cluster configured -- E2E validation will be skipped"
            echo "To enable: set OCP_API_URL and OCP_TOKEN in repository secrets"
            echo "  Or trigger manually with workflow_dispatch inputs"
            exit 0
          fi

          if curl -sk --max-time 10 "${OCP_API_URL}/.well-known/oauth-authorization-server" > /dev/null 2>&1; then
            echo "cluster_available=true" >> $GITHUB_OUTPUT
            echo "OpenShift cluster is reachable at ${OCP_API_URL}"
          else
            echo "cluster_available=false" >> $GITHUB_OUTPUT
            echo "OpenShift cluster configured but unreachable -- skipping E2E"
          fi

  # ──────────────────────────────────────────────────────────────────────────
  # Job 3: Deploy and validate the pattern on the live cluster
  # ──────────────────────────────────────────────────────────────────────────
  validate-pattern:
    name: Pattern E2E Validation
    runs-on: ubuntu-latest
    needs: [check-trigger, check-cluster]
    concurrency:
      group: rosa-cluster-platform-e2e
      cancel-in-progress: false
    if: |
      always()
      && needs.check-trigger.outputs.should_run == 'true'
      && needs.check-cluster.outputs.cluster_available == 'true'
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install oc CLI
        uses: redhat-actions/openshift-tools-installer@v1
        with:
          oc: latest

      - name: Login to OpenShift
        env:
          OCP_API_URL: ${{ github.event.inputs.ocp_api_url || secrets.OCP_API_URL }}
          OCP_TOKEN: ${{ github.event.inputs.ocp_token || secrets.OCP_TOKEN }}
        run: |
          oc login "$OCP_API_URL" \
            --token="$OCP_TOKEN" \
            --insecure-skip-tls-verify

          echo "Logged in as: $(oc whoami)"
          echo "Server: $(oc whoami --show-server)"
          echo "Cluster version: $(oc get clusterversion version -o jsonpath='{.status.desired.version}' 2>/dev/null || echo 'unknown')"

      - name: Install pattern
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.skip_install != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y podman
          ./pattern.sh make install

      - name: Wait for ArgoCD convergence
        timeout-minutes: 30
        run: |
          echo "Waiting for ArgoCD applications to converge in ${{ env.HUB_NS }}..."
          for i in $(seq 1 60); do
            APPS=$(oc get applications.argoproj.io -n "${{ env.HUB_NS }}" -o name 2>/dev/null | wc -l)
            if [ "$APPS" -eq 0 ]; then
              echo "Attempt $i/60: No ArgoCD applications found yet..."
              sleep 30
              continue
            fi

            NOT_HEALTHY=$(oc get applications.argoproj.io -n "${{ env.HUB_NS }}" \
              -o jsonpath='{range .items[*]}{.status.health.status}{"\n"}{end}' \
              2>/dev/null | grep -cv '^Healthy$' || true)
            NOT_SYNCED=$(oc get applications.argoproj.io -n "${{ env.HUB_NS }}" \
              -o jsonpath='{range .items[*]}{.status.sync.status}{"\n"}{end}' \
              2>/dev/null | grep -cv '^Synced$' || true)
            echo "Attempt $i/60: apps=$APPS not-healthy=$NOT_HEALTHY not-synced=$NOT_SYNCED"

            if [ "$NOT_HEALTHY" -eq 0 ] && [ "$NOT_SYNCED" -eq 0 ]; then
              echo "All $APPS ArgoCD applications are Synced/Healthy"
              exit 0
            fi
            sleep 30
          done
          echo "ERROR: ArgoCD convergence timeout after 30 minutes"
          oc get applications.argoproj.io -n "${{ env.HUB_NS }}" \
            -o custom-columns='NAME:.metadata.name,HEALTH:.status.health.status,SYNC:.status.sync.status'
          exit 1

      - name: Validate core deployments
        run: |
          echo "=== Core Deployment Checks ==="
          FAILURES=0

          for deploy in coordination-engine mcp-server; do
            READY=$(oc get deployment "$deploy" -n "${{ env.PLATFORM_NS }}" \
              -o jsonpath='{.status.readyReplicas}' 2>/dev/null || echo "0")
            if [ "${READY:-0}" -lt 1 ]; then
              echo "FAIL: $deploy -- 0 ready replicas"
              oc get pods -n "${{ env.PLATFORM_NS }}" -l "app=$deploy" 2>/dev/null || true
              FAILURES=$((FAILURES + 1))
            else
              echo "PASS: $deploy -- $READY ready"
            fi
          done

          if [ "$FAILURES" -gt 0 ]; then
            echo "ERROR: $FAILURES core deployment(s) not ready"
            exit 1
          fi

      - name: Health endpoint checks
        run: |
          echo "=== Health Endpoint Checks ==="

          POD_NAME=$(oc get pods -n "${{ env.PLATFORM_NS }}" \
            -l app=coordination-engine \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)

          if [ -z "$POD_NAME" ]; then
            echo "FAIL: No coordination-engine pod found"
            exit 1
          fi

          oc port-forward "pod/${POD_NAME}" 18080:8080 \
            -n "${{ env.PLATFORM_NS }}" &
          PF_PID=$!
          sleep 5

          RESPONSE=$(curl -sf --max-time 10 http://localhost:18080/health 2>/dev/null || echo '{"status":"unreachable"}')
          echo "Health response: ${RESPONSE}"

          STATUS=$(echo "${RESPONSE}" | jq -r '.status' 2>/dev/null || echo "parse_error")
          if [ "$STATUS" = "ok" ] || [ "$STATUS" = "healthy" ]; then
            echo "PASS: coordination-engine health check"
          else
            echo "FAIL: coordination-engine health -- status='${STATUS}'"
            kill $PF_PID 2>/dev/null || true
            exit 1
          fi

          kill $PF_PID 2>/dev/null || true

      - name: Verify InferenceServices
        run: |
          echo "=== InferenceService Checks ==="
          FAILURES=0

          for isvc in anomaly-detector predictive-analytics; do
            EXISTS=$(oc get inferenceservice "$isvc" -n "${{ env.PLATFORM_NS }}" \
              -o jsonpath='{.metadata.name}' 2>/dev/null || echo "")
            if [ -z "$EXISTS" ]; then
              echo "WARN: InferenceService $isvc not found (may not be deployed yet)"
            else
              READY=$(oc get inferenceservice "$isvc" -n "${{ env.PLATFORM_NS }}" \
                -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}' 2>/dev/null || echo "Unknown")
              echo "INFO: InferenceService $isvc exists -- Ready=$READY"
            fi
          done

          echo "PASS: InferenceService check complete"

      - name: Verify S3 storage configuration
        run: |
          echo "=== S3 Storage Checks ==="

          SECRET_EXISTS=$(oc get secret model-storage-config -n "${{ env.PLATFORM_NS }}" \
            -o jsonpath='{.metadata.name}' 2>/dev/null || echo "")
          if [ -z "$SECRET_EXISTS" ]; then
            echo "WARN: model-storage-config secret not found"
          else
            KEYS=$(oc get secret model-storage-config -n "${{ env.PLATFORM_NS }}" \
              -o jsonpath='{.data}' 2>/dev/null | jq -r 'keys[]' 2>/dev/null || echo "none")
            echo "INFO: model-storage-config secret exists with keys: $KEYS"
            echo "PASS: S3 storage configuration present"
          fi

      - name: Verify Tekton pipelines
        run: |
          echo "=== Tekton Pipeline Checks ==="

          PIPELINE_COUNT=$(oc get pipelines -n "${{ env.PLATFORM_NS }}" -o name 2>/dev/null | wc -l)
          echo "INFO: Found $PIPELINE_COUNT pipeline(s) in ${{ env.PLATFORM_NS }}"

          if [ "$PIPELINE_COUNT" -gt 0 ]; then
            oc get pipelines -n "${{ env.PLATFORM_NS }}" \
              -o custom-columns='NAME:.metadata.name' --no-headers
            echo "PASS: Tekton pipelines present"
          else
            echo "WARN: No Tekton pipelines found (may not be deployed yet)"
          fi

      - name: Collect diagnostic logs
        if: always()
        run: |
          mkdir -p logs

          echo "Collecting diagnostic information..."

          echo "=== ArgoCD Applications ===" > logs/argocd-apps.txt
          oc get applications.argoproj.io -n "${{ env.HUB_NS }}" \
            -o custom-columns='NAME:.metadata.name,HEALTH:.status.health.status,SYNC:.status.sync.status' \
            >> logs/argocd-apps.txt 2>&1 || true

          echo "=== Pods ===" > logs/pods.txt
          oc get pods -n "${{ env.PLATFORM_NS }}" -o wide \
            >> logs/pods.txt 2>&1 || true

          echo "=== Pod YAML ===" > logs/pods-yaml.txt
          oc get pods -n "${{ env.PLATFORM_NS }}" -o yaml \
            >> logs/pods-yaml.txt 2>&1 || true

          echo "=== Events ===" > logs/events.txt
          oc get events -n "${{ env.PLATFORM_NS }}" \
            --sort-by='.lastTimestamp' \
            >> logs/events.txt 2>&1 || true

          echo "=== InferenceServices ===" > logs/inferenceservices.txt
          oc get inferenceservices -n "${{ env.PLATFORM_NS }}" -o yaml \
            >> logs/inferenceservices.txt 2>&1 || true

          echo "=== Coordination Engine Logs ===" > logs/coordination-engine.log
          oc logs -n "${{ env.PLATFORM_NS }}" \
            -l app=coordination-engine \
            --tail=200 \
            >> logs/coordination-engine.log 2>&1 || true

          echo "=== MCP Server Logs ===" > logs/mcp-server.log
          oc logs -n "${{ env.PLATFORM_NS }}" \
            -l app=mcp-server \
            --tail=200 \
            >> logs/mcp-server.log 2>&1 || true

          echo "=== PipelineRuns ===" > logs/pipelineruns.txt
          oc get pipelineruns -n "${{ env.PLATFORM_NS }}" \
            >> logs/pipelineruns.txt 2>&1 || true

          echo "Diagnostic collection complete"
          ls -la logs/

      - name: Upload diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-pattern-logs-${{ github.run_id }}
          path: logs/
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  # Job 4: Report overall E2E status
  # ──────────────────────────────────────────────────────────────────────────
  e2e-status:
    name: E2E Status
    runs-on: ubuntu-latest
    needs: [check-trigger, check-cluster, validate-pattern]
    if: always() && needs.check-trigger.outputs.should_run == 'true'
    steps:
      - name: Report E2E results
        run: |
          echo "=== Validate Pattern E2E Results ==="
          echo ""

          if [ "${{ needs.check-cluster.outputs.cluster_available }}" != "true" ]; then
            echo "SKIPPED: No OpenShift cluster available"
            echo "  To enable: set OCP_API_URL and OCP_TOKEN repository secrets"
            echo "  Or trigger manually via workflow_dispatch"
            echo ""
            echo "This is expected when cluster secrets are not configured."
            exit 0
          fi

          if [ "${{ needs.validate-pattern.result }}" == "success" ]; then
            echo "PASSED: All validation checks succeeded"
            echo "  - ArgoCD convergence: OK"
            echo "  - Core deployments: OK"
            echo "  - Health endpoints: OK"
            echo "  - InferenceServices: OK"
            echo "  - S3 storage: OK"
            echo "  - Tekton pipelines: OK"
            exit 0
          fi

          if [ "${{ needs.validate-pattern.result }}" == "skipped" ]; then
            echo "SKIPPED: Validation was not executed"
            exit 0
          fi

          echo "FAILED: Pattern validation encountered errors"
          echo "  Check the 'validate-pattern-logs-${{ github.run_id }}' artifact for details"
          exit 1
