apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: openshift-aiops-platform
  title: OpenShift AI Ops Self-Healing Platform
  description: >
    Production-ready AIOps platform combining deterministic automation with
    AI-driven analysis for OpenShift cluster self-healing.
  annotations:
    backstage.io/techdocs-ref: dir:.
    github.com/project-slug: KubeHeal/openshift-aiops-platform
  tags:
    - openshift
    - aiops
    - self-healing
    - validated-pattern
    - machine-learning
  links:
    - url: https://github.com/KubeHeal/openshift-aiops-platform
      title: GitHub Repository
      icon: github
    - url: https://github.com/KubeHeal/openshift-aiops-platform/tree/main/docs
      title: Documentation
      icon: docs
spec:
  owner: group:kubeheal
  lifecycle: production
  domain: aiops
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: coordination-engine
  title: Self-Healing Coordination Engine
  description: >
    Go-based orchestration engine for hybrid deterministic-AI remediation.
    Manages conflict resolution, priority, and action orchestration.
  annotations:
    github.com/project-slug: KubeHeal/openshift-coordination-engine
  tags:
    - go
    - coordination
    - self-healing
  links:
    - url: https://github.com/KubeHeal/openshift-coordination-engine
      title: GitHub Repository
      icon: github
    - url: https://quay.io/repository/takinosh/openshift-coordination-engine
      title: Container Image
      icon: docker
spec:
  type: service
  owner: group:kubeheal
  lifecycle: production
  system: openshift-aiops-platform
  dependsOn:
    - resource:prometheus
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: cluster-health-mcp
  title: Cluster Health MCP Server
  description: >
    Go-based Model Context Protocol server providing 17 tools, 4 resources,
    and 6 prompts for OpenShift Lightspeed integration.
  annotations:
    github.com/project-slug: KubeHeal/openshift-cluster-health-mcp
  tags:
    - go
    - mcp
    - lightspeed
  links:
    - url: https://github.com/KubeHeal/openshift-cluster-health-mcp
      title: GitHub Repository
      icon: github
    - url: https://quay.io/repository/takinosh/openshift-cluster-health-mcp
      title: Container Image
      icon: docker
spec:
  type: service
  owner: group:kubeheal
  lifecycle: production
  system: openshift-aiops-platform
  dependsOn:
    - component:coordination-engine
    - resource:prometheus
---
apiVersion: backstage.io/v1alpha1
