{{- /*
  Console Plugins Configuration
  Registers operator console plugins so they appear in the OpenShift web console.

  Plugins enabled:
  - pipelines-console-plugin  (OpenShift Pipelines UI)
  - monitoring-plugin          (Monitoring dashboards)
  - networking-console-plugin  (Networking views)
  - patterns-operator-console-plugin (Validated Patterns)
  - gitops-plugin              (ArgoCD/GitOps UI)

  Uses ServerSideApply to merge the plugins list without clobbering
  other Console spec fields (customization, brand, capabilities, etc.).
*/ -}}
apiVersion: operator.openshift.io/v1
kind: Console
metadata:
  name: cluster
  annotations:
    argocd.argoproj.io/sync-wave: "-8"
    argocd.argoproj.io/sync-options: ServerSideApply=true
spec:
  plugins:
    - pipelines-console-plugin
    - monitoring-plugin
    - networking-console-plugin
    - patterns-operator-console-plugin
    - gitops-plugin
